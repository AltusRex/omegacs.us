# Refreshes data/activity.json from GitHub's contribution calendar once a day.
# Private-repo work counts only if "Include private contributions on my profile" is on in GitHub profile settings.
name: Update activity

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contribution calendar
        env:
          # The built-in token can read public profile data. ACTIVITY_TOKEN is an optional read-only fallback.
          GH_TOKEN: ${{ secrets.ACTIVITY_TOKEN || github.token }}
          LOGIN: ${{ github.repository_owner }}
        run: |
          gh api graphql -f login="$LOGIN" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    weeks { contributionDays { date contributionCount } }
                  }
                }
              }
            }' > "$RUNNER_TEMP/calendar.json"
          python3 scripts/activity.py "$RUNNER_TEMP/calendar.json" data/activity.json

      - name: Commit if it changed
        run: |
          if git diff --quiet -- data/activity.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/activity.json
          git commit -m "Update activity data"
          git push
