<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:site_name" content="Omega Creative Systems">
<title>{% if page.title and page.nav != 'home' %}{{ page.title | escape }} · {% endif %}Joseph Landry · Omega Creative Systems</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="alternate" type="application/atom+xml" title="Joseph Landry's blog" href="{{ '/blog/feed.xml' | relative_url }}">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#14101d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f8f5fb" media="(prefers-color-scheme: light)">
<meta name="pizzazz-recipe" content='{"pz":1,"kit":"my-color-profile","concept":"Wisp Trail","family":"wildcard","dev":{"intensity":"standard","motion":"scroll lighting","interactivity":"margin index, theme toggle, copy email, activity matrix, rule links, section backdrop"},"sig":"glowing waypoint trail","pal":{"pri":"#EFE9F7","sec":"#FFAA4D","tint":"#1C1727","zeb":"#1C1727","mut":"#A79CBB","ftr":"#A79CBB","hair":"#2A2236","acc":"#C6F02A","watch":"#FFAA4D"},"font":{"h":"Archivo","b":"IBM Plex Sans"},"date":"2026-11-17"}'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<script>
/* Apply a saved theme choice before paint; the system setting decides otherwise. */
(function(){try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}document.documentElement.classList.add('js');})();
</script>
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body class="page-{{ page.nav | default: 'other' }}">
<div class="wrap" id="top">

<header class="top">
  <a class="mark" href="{{ '/' | relative_url }}"><i aria-hidden="true"></i>Joseph Landry</a>
  <nav class="site-nav" aria-label="Site">
    <a href="{{ '/' | relative_url }}"{% if page.nav == 'home' %} aria-current="page"{% endif %}>Home</a>
    <a href="{{ '/portfolio/' | relative_url }}"{% if page.nav == 'portfolio' %} aria-current="page"{% endif %}>Portfolio</a>
    <a href="{{ '/blog/' | relative_url }}"{% if page.nav == 'blog' %} aria-current="page"{% endif %}>Blog</a>
  </nav>
  <div class="tools">
    <a class="icon-btn" href="https://github.com/AltusRex" target="_blank" rel="noopener" aria-label="GitHub profile">{% include icon-github.html %}<span class="hide-sm">GitHub</span></a>
    <button class="icon-btn theme-btn" type="button" id="theme-toggle" aria-label="Switch light or dark theme"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </div>
</header>

{{ content }}

<footer>
  <span>Joseph Landry <span class="gem" aria-hidden="true">&#9670;</span> <abbr title="OmegaCS">Omega Creative Systems</abbr></span>
  <span>Maintained with Claude. Updated {{ site.time | date: "%B %Y" }}.</span>
</footer>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="{{ '/assets/site.js' | relative_url }}"></script>
{% for s in page.scripts %}<script src="{{ s | relative_url }}"></script>
{% endfor %}</body>
</html>
